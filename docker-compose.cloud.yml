services:
  cloud:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-127.0.0.1:8080}:8080"
    environment:
      ADDR: :8080
      DATABASE_PATH: /data/t2va.db
      STORAGE_PATH: /data/files
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN}
      USER_API_KEY: ${USER_API_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WORKER_ALLOWED_ORIGIN: ${WORKER_ALLOWED_ORIGIN:-}
    volumes:
      - t2va-data:/data
volumes:
  t2va-data:
